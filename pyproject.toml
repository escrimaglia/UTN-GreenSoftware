[project]
name = "huella-carbono"
version = "0.4.4"
description = "Medición de la huella de carbono de algoritmos en Python — proyecto UTN"
readme = "README.md"
authors = [
    { name = "Ed Scrimaglia", email = "edgardo.scrimaglia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "codecarbon>=3.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psutil>=7.2.2",
    "scikit-learn>=1.9.0",
]

[project.scripts]
huella-carbono = "huella_carbono.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
